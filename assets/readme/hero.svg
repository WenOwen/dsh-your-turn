<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-labelledby="hero-title hero-desc" preserveAspectRatio="xMidYMid meet">
  <title id="hero-title">@wu5/dsh-your-turn — turn-handoff reminder for DeepSeek Harness</title>
  <desc id="hero-desc">A centred popup and a synthesized chime for every Agent handoff. Six voices generated in the browser, no audio files shipped.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11141a"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.0"/>
      <stop offset="0.45" stop-color="#d97757" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e0a172" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#d97757" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- 1px hairlines that anchor the card grid -->
  <g stroke="#1e2229" stroke-width="1">
    <line x1="60" y1="60" x2="1140" y2="60"/>
    <line x1="60" y1="300" x2="1140" y2="300"/>
  </g>

  <!-- Eyebrow / category -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#7d8590">
    <text x="60" y="92" font-size="14" letter-spacing="2.4">DEEPSEEK HARNESS · CORDIS PLUGIN</text>
  </g>

  <!-- Title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#f1ece6">
    <text x="60" y="172" font-size="52" font-weight="700" letter-spacing="-1.2">@wu5/dsh-your-turn</text>
    <text x="60" y="214" font-size="20" font-weight="400" fill="#b6bcc4">轮到你了 — popup + chime when an Agent hands the turn back.</text>
  </g>

  <!-- Pill row: proof points -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(60 240)">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#181c23" stroke="#262b34"/>
      <text x="60" y="20" text-anchor="middle" font-size="13" fill="#cfd4dc">6 voices</text>
    </g>
    <g transform="translate(190 240)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="#181c23" stroke="#262b34"/>
      <text x="80" y="20" text-anchor="middle" font-size="13" fill="#cfd4dc">no audio files</text>
    </g>
    <g transform="translate(360 240)">
      <rect x="0" y="0" width="170" height="30" rx="15" fill="#181c23" stroke="#262b34"/>
      <text x="85" y="20" text-anchor="middle" font-size="13" fill="#cfd4dc">no Host Remote</text>
    </g>
    <g transform="translate(540 240)">
      <rect x="0" y="0" width="170" height="30" rx="15" fill="#181c23" stroke="#262b34"/>
      <text x="85" y="20" text-anchor="middle" font-size="13" fill="#cfd4dc">zero-dep runtime</text>
    </g>
  </g>

  <!-- Footer metadata -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" fill="#5b6470" font-size="13">
    <text x="60" y="320">v0.2.0-rc.2   ·   cordis patch + browser bundle   ·   DSH 0.2.0-rc.2 / commit 04f392c9</text>
  </g>

  <!-- ============================================================ -->
  <!-- Right side: composed chime waveform (the proof)                -->
  <!-- ============================================================ -->
  <g transform="translate(700 60)">
    <!-- backplate -->
    <rect x="0" y="0" width="440" height="240" rx="14" fill="#14171d" stroke="#1d2129"/>

    <!-- horizontal grid (subtle) -->
    <g stroke="#1c1f25" stroke-width="1">
      <line x1="20" y1="60"  x2="420" y2="60"/>
      <line x1="20" y1="120" x2="420" y2="120"/>
      <line x1="20" y1="180" x2="420" y2="180"/>
    </g>

    <!-- six voices, each a damped sine burst along time -->
    <g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <!-- chime: long two-partial, low frequency -->
      <path stroke="#d97757" d="M22 124 C 60 70, 110 70, 150 124 C 200 178, 280 178, 360 122"/>
      <!-- ping: short single high tone -->
      <path stroke="#e8a87a" d="M30 100 C 70 92, 110 92, 150 100 C 170 104, 190 104, 210 100"/>
      <!-- marimba: woody sharp attack -->
      <path stroke="#c1d2c4" d="M28 140 C 70 110, 110 110, 150 140 C 190 170, 230 170, 270 140"/>
      <!-- arcade: rising square-stepped -->
      <path stroke="#a8c4d4" d="M30 130 L 60 130 L 60 90 L 100 90 L 100 60 L 140 60 L 140 30 L 200 30"/>
      <!-- drop: falling -->
      <path stroke="#b5a0c8" d="M30 70 C 80 70, 130 90, 200 130 C 260 160, 320 180, 400 200"/>
      <!-- alert: tri-tone -->
      <path stroke="#d97c7c" d="M30 110 L 80 110 L 80 80 L 130 80 L 130 110 L 180 110 L 180 70 L 240 70"/>
    </g>

    <!-- the active trace glow underline -->
    <rect x="20" y="216" width="400" height="2" fill="url(#accent)"/>

    <!-- labels -->
    <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#6e7682">
      <text x="20"  y="22">chime</text>
      <text x="78"  y="22">ping</text>
      <text x="120" y="22">marimba</text>
      <text x="200" y="22">arcade</text>
      <text x="260" y="22">drop</text>
      <text x="306" y="22">alert</text>
    </g>
  </g>

  <!-- A small reminder card silhouette in the bottom-right to hint at the popup -->
  <g transform="translate(700 300)">
    <rect x="0" y="0" width="220" height="44" rx="10" fill="#181c23" stroke="#262b34"/>
    <circle cx="18" cy="22" r="5" fill="#3a7d6e"/>
    <rect x="34" y="14" width="130" height="6" rx="3" fill="#cfd4dc" opacity="0.85"/>
    <rect x="34" y="26" width="86"  height="5" rx="2.5" fill="#5b6470"/>
    <rect x="170" y="13" width="40" height="18" rx="9" fill="#262b34"/>
    <text x="190" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#cfd4dc">Open</text>
  </g>
</svg>
