<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">回合交接提醒示意</title>
  <desc id="desc">功能示意，非截图。回合完成后可跳到会话、知道了或稍后提醒；DSH 等待回答问题时只响铃，不额外弹窗。</desc>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif"><rect width="1200" height="460" fill="#0d1117"/>
    <text x="56" y="55" font-size="20" fill="#a8b2c1">功能示意 / 回合交接</text>
    <g id="reminder-card">
      <rect x="56" y="84" width="630" height="320" rx="14" fill="#181e28" stroke="#37404e" stroke-width="2"/>
      <text x="88" y="139" fill="#f0f4f8" font-size="36" font-weight="700">轮到你了</text>
      <circle cx="97" cy="184" r="7" fill="#a6d65b"/>
      <text x="116" y="193" fill="#a6d65b" font-size="26">回合已完成</text>
      <text x="88" y="245" fill="#f0f4f8" font-size="30">你的项目会话</text>
      <text x="88" y="281" fill="#a8b2c1" font-size="22">查看会话标题、工作目录与回合用时</text>
      <rect x="88" y="324" width="252" height="48" rx="6" fill="#2b3341"/>
      <text x="214" y="356" text-anchor="middle" fill="#f0f4f8" font-size="24">5 分钟后再提醒</text>
      <text x="418" y="356" text-anchor="middle" fill="#f0f4f8" font-size="24">知道了</text>
      <rect x="494" y="324" width="160" height="48" rx="6" fill="#ffd82e"/>
      <text x="574" y="356" text-anchor="middle" fill="#171b22" font-size="24" font-weight="700">跳到会话</text>
    </g>
    <g id="sound-and-unread">
      <text x="748" y="135" fill="#ffd82e" font-size="32" font-weight="700">听见交接，也能找回</text>
      <text x="748" y="187" fill="#f0f4f8" font-size="26">侧栏小喇叭切换声音</text>
      <text x="748" y="229" fill="#a8b2c1" font-size="24">未查看提醒保留在列表里</text>
      <path d="M748 267H1144" stroke="#37404e"/>
      <text x="748" y="320" fill="#f0f4f8" font-size="26">等待你回答时，也响一次</text>
      <text x="748" y="362" fill="#a8b2c1" font-size="24">不额外弹窗遮住问题</text>
    </g></g>
</svg>
