<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">提醒如何到达你</title>
  <desc id="desc">Agent 回合结束，Web 客户端观察状态变化，插件弹窗并播放提示音。新问题等待回答时只响铃。</desc>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif"><rect width="1200" height="260" fill="#0d1117"/>
    <text x="56" y="56" font-size="30" font-weight="700" fill="#f0f4f8">从回合结束，到轮到你</text>
    <g font-size="28" font-weight="700" fill="#f0f4f8">
      <text x="56" y="133" fill="#ffd82e">01</text><text x="113" y="133">回合结束</text>
      <text x="461" y="133" fill="#ffd82e">02</text><text x="518" y="133">观察状态</text>
      <text x="866" y="133" fill="#ffd82e">03</text><text x="923" y="133">提醒交接</text>
    </g>
    <g fill="none" stroke="#a8b2c1" stroke-width="3"><path d="M326 123H409L397 111M409 123L397 135"/><path d="M731 123H814L802 111M814 123L802 135"/></g>
    <g font-size="22" fill="#a8b2c1"><text x="56" y="181">完成、出错、中断或截断</text><text x="461" y="181">读取已有的客户端状态</text><text x="866" y="181">弹窗 / 横幅 + 提示音</text></g>
    <text x="56" y="232" fill="#a8b2c1" font-size="20">无需轮询日志文件 · 同源多标签协同 · 新问题等待回答时只响铃</text></g>
</svg>
